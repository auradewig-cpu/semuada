name: Dispatch scheduled posts

# Vercel's Hobby plan only runs native cron jobs once/day -- far too coarse
# for 06:00/12:00/19:00-style posting slots. This workflow is the frequent
# trigger instead, calling the app's own /api/cron/dispatch-posts endpoint
# (protected by CRON_SECRET) every 10 minutes. GitHub Actions' scheduled
# workflows are best-effort timing (can lag a few minutes under load), which
# is fine here -- the app's own database is the source of truth for what's
# due, this just knocks on the door often enough to notice.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Call dispatch-posts
        run: |
          curl --fail --silent --show-error \
            "${{ secrets.SCHEDULER_SITE_URL }}/api/cron/dispatch-posts" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      # Called on EVERY run; the route itself decides whether a sync is due
      # (it skips unless the newest snapshot is 3+ hours old). This used to be
      # gated here on the run landing in UTC hour 00/08/16 -- but this
      # "every 10 minutes" schedule really fires every 4-7 hours, so hitting
      # one of those hours was luck, and from 2026-11-04 it stopped happening:
      # no metrics for days, history that can never be backfilled. Keeping the
      # cadence in the app makes it independent of GitHub's timing.
      #
      # A manual workflow_dispatch passes force=1, so the job can be tested
      # without waiting out the interval.
      - name: Call sync-metrics
        run: |
          FORCE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then FORCE="?force=1"; fi
          curl --fail --silent --show-error \
            "${{ secrets.SCHEDULER_SITE_URL }}/api/cron/sync-metrics$FORCE" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
