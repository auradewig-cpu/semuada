name: Dispatch scheduled posts

# Vercel's Hobby plan only runs native cron jobs once/day -- far too coarse
# for 06:00/12:00/19:00-style posting slots. This workflow is the frequent
# trigger instead, calling the app's own /api/cron/dispatch-posts endpoint
# (protected by CRON_SECRET) every 10 minutes. GitHub Actions' scheduled
# workflows are best-effort timing (can lag a few minutes under load), which
# is fine here -- the app's own database is the source of truth for what's
# due, this just knocks on the door often enough to notice.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Call dispatch-posts
        run: |
          curl --fail --silent --show-error \
            "${{ secrets.SCHEDULER_SITE_URL }}/api/cron/dispatch-posts" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      # Performance metrics don't need the 10-minute cadence the dispatcher
      # above runs on -- Buffer re-ingests its numbers only once every 24h, so
      # syncing that often can't surface fresher data. Restricted to three
      # hours of the day instead.
      #
      # This workflow fires every 10 minutes, so each window still triggers a
      # handful of syncs. That redundancy is deliberate and harmless: the sync
      # upserts one row per (post, platform, day), so repeat runs rewrite the
      # same row rather than duplicating it. Gating on the hour alone (no
      # minute check) is what makes it drift-tolerant -- GitHub's scheduler
      # has been observed slipping 25-40 minutes under load, which a narrow
      # minute window would simply miss, costing a whole day of history that
      # can never be backfilled.
      - name: Call sync-metrics
        run: |
          HOUR=$(date -u +%H)
          # Three windows a day, at 00/08/16 UTC (07:00 / 15:00 / 23:00 WIB) --
          # spread out so a total failure in one window is picked up by the
          # next. A manual workflow_dispatch always syncs, so the job can be
          # tested without waiting for a window.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$HOUR" = "00" ] || [ "$HOUR" = "08" ] || [ "$HOUR" = "16" ]; then
            curl --fail --silent --show-error \
              "${{ secrets.SCHEDULER_SITE_URL }}/api/cron/sync-metrics" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
          else
            echo "Not a metrics-sync window (UTC hour $HOUR) -- skipping."
          fi
